<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图库上传工具 · 本地后台</title>
<style>
  :root{--brand:#4f46e5;--brand-2:#6366f1;--brand-soft:#eef2ff;--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--ok:#16a34a;--err:#dc2626;--shadow:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  header{background:linear-gradient(135deg,#4f46e5,#4338ca);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(30,27,75,.22);}
  header h1{font-size:17px;font-weight:700;letter-spacing:.5px;}
  header span{font-size:12px;color:#c7d2fe;opacity:.95;}
  .layout{display:flex;min-height:calc(100vh - 52px);}
  nav{width:170px;background:var(--card);border-right:1px solid var(--line);padding:14px 10px;}
  nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 14px;border:none;background:none;border-radius:10px;cursor:pointer;font-size:14px;color:var(--muted);margin-bottom:4px;transition:background .15s,color .15s;}
  nav button:hover{background:var(--brand-soft);color:var(--brand);}
  nav button.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(79,70,229,.4);}
  nav button.active:hover{color:#fff;}
  .nav-ico{width:18px;text-align:center;font-size:15px;}
  main{flex:1;padding:24px;overflow:auto;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow);}
  .card h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .card h2::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--brand);}
  .drop{border:2px dashed var(--brand-2);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s;background:#f8fafc;}
  .drop:hover,.drop.over{background:var(--brand-soft);border-color:var(--brand);}
  .drop b{color:var(--brand);}
  .drop .drop-ico{font-size:34px;display:block;margin-bottom:8px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:flex-end;}
  .field{flex:1;min-width:170px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  input,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;transition:border .15s,box-shadow .15s;}
  input:focus,select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(99,102,241,.16);}
  input[type="range"]{padding:0;accent-color:var(--brand);}
  button.btn{background:var(--brand);color:#fff;border:none;padding:10px 22px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(79,70,229,.32);transition:filter .15s,transform .1s;}
  button.btn:hover{filter:brightness(1.1);}
  button.btn:active{transform:scale(.98);}
  button.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);box-shadow:none;padding:8px 16px;font-weight:600;}
  button.ghost:hover{background:var(--brand-soft);}
  button.mini{padding:4px 10px;font-size:12px;border-radius:7px;}
  .progress{height:8px;background:#e2e8f0;border-radius:4px;margin-top:14px;overflow:hidden;display:none;}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand-2),var(--brand));transition:width .3s;}
  .log{font-size:12px;color:var(--muted);margin-top:12px;max-height:280px;overflow:auto;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:none;}
  .task-row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line);}
  .task-row:last-child{border-bottom:none;}
  .t-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-state{white-space:nowrap;font-weight:600;border-radius:6px;padding:0 8px;font-size:11px;line-height:20px;}
  .t-state.running{color:#4338ca;background:#e0e7ff;}
  .t-state.ok{color:#15803d;background:#dcfce7;}
  .t-state.err{color:#b91c1c;background:#fee2e2;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
  th{color:var(--muted);font-weight:500;white-space:nowrap;background:#f8fafc;}
  tbody tr:hover{background:#f8fafc;}
  .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .tag.pc{background:#e0e7ff;color:#4338ca;}
  .tag.phone{background:#e0f2fe;color:#0369a1;}
  .tag.both{background:#fef3c7;color:#a16207;}
  .gallery-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .gallery-head .cols{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
  .gallery-head .cols input[type="range"]{width:150px;}
  .gallery-head .cols b{color:var(--brand);min-width:30px;text-align:center;}
  .grid{display:grid;gap:12px;}
  .grid .item{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;transition:transform .15s,box-shadow .2s;cursor:pointer;}
  .grid .item:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(30,27,75,.14);}
  /* 图片按原比例完整显示，不裁切 */
  .grid .item img{width:100%;height:auto;display:block;background:#f1f5f9;}
  .grid .meta{padding:7px 10px;font-size:11px;color:var(--muted);line-height:1.5;word-break:break-all;}
  .grid .meta b{color:var(--text);font-weight:600;}
  .grid .del{position:absolute;top:6px;right:6px;background:rgba(15,23,42,.6);color:#fff;border:none;border-radius:7px;padding:3px 9px;cursor:pointer;font-size:11px;opacity:0;transition:opacity .15s,background .15s;}
  .grid .item:hover .del{opacity:1;}
  .grid .del:hover{background:#dc2626;}
  .grid .pool{position:absolute;top:6px;left:6px;}
  .msg{font-size:13px;margin-top:8px;}
  .ok{color:var(--ok);} .err{color:var(--err);}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px;}
</style>
</head>
<body>
<header>
  <h1>图库上传工具</h1>
  <span>本地服务 127.0.0.1:8787</span>
</header>
<div class="layout">
  <nav>
    <button data-panel="upload"><span class="nav-ico">↑</span>上传</button>
    <button data-panel="storages"><span class="nav-ico">☁</span>存储配置</button>
    <button data-panel="gallery"><span class="nav-ico">▦</span>图库</button>
  </nav>
  <main>

    <!-- 上传 -->
    <section id="upload" class="panel">
      <div class="card">
        <h2>上传图片</h2>
        <div class="drop" id="drop"><span class="drop-ico">🖼</span>拖拽图片到此处或<b>点击选择</b><br><small>支持 JPG / PNG / WEBP，自动压缩为 AVIF</small></div>
        <input type="file" id="file" multiple accept="image/*" hidden>
        <div class="row">
          <div class="field">
            <label>目标存储</label>
            <select id="storage"></select>
          </div>
          <div class="field">
            <label>图池（默认自动按宽高比）</label>
            <select id="pool">
              <option value="">自动</option>
              <option value="pc">pc</option>
              <option value="phone">phone</option>
              <option value="both">both</option>
            </select>
          </div>
          <div class="field">
            <label>上传间隔（毫秒，防风控）</label>
            <input type="number" id="interval" value="300" min="0" step="100">
          </div>
        </div>
        <div class="progress" id="progress"><i id="bar"></i></div>
        <div class="log" id="log"></div>
        <div class="row">
          <button class="btn" id="start" disabled>开始上传</button>
        </div>
      </div>
    </section>

    <!-- 存储配置 -->
    <section id="storages" class="panel">
      <div class="card">
        <h2>存储档案</h2>
        <table>
          <thead><tr><th>ID</th><th>名称</th><th>类型</th><th>桶</th><th>公网域名</th><th>操作</th></tr></thead>
          <tbody id="storageRows"></tbody>
        </table>
      </div>
      <div class="card">
        <h2>新增 / 编辑</h2>
        <div class="row">
          <div class="field"><label>名称</label><input id="f_name" placeholder="七牛-华东"></div>
          <div class="field"><label>类型</label><select id="f_provider"><option value="qiniu">七牛云</option><option value="r2">Cloudflare R2</option><option value="s3">S3 兼容</option></select></div>
          <div class="field"><label>Endpoint（S3 API 端点）</label><input id="f_endpoint" placeholder="https://s3.cn-south-1.qiniucs.com"></div>
          <div class="field"><label>Region</label><input id="f_region" placeholder="cn-south-1 / auto"></div>
          <div class="field"><label>Access Key</label><input id="f_ak"></div>
          <div class="field"><label>Secret Key</label><input id="f_sk" type="password"></div>
          <div class="field"><label>Bucket</label><input id="f_bucket"></div>
          <div class="field"><label>PathPrefix</label><input id="f_prefix" value=""></div>
          <div class="field"><label>BaseUrl（公网域名，不写死）</label><input id="f_base" placeholder="https://cdn.example.com/"></div>
        </div>
        <div class="row">
          <button class="btn ghost" id="testBtn">测试连接</button>
          <button class="btn" id="saveBtn">保存</button>
        </div>
        <div class="msg" id="storageMsg"></div>
      </div>
    </section>

    <!-- 图库 -->
    <section id="gallery" class="panel">
      <div class="card">
        <h2>已收录图片<span id="count" style="color:var(--muted);font-size:12px;font-weight:400"></span></h2>
        <div class="gallery-head">
          <div class="row" style="margin:0">
            <button class="btn ghost" id="genIndex">发布索引（线上立即生效）</button>
            <span class="msg" id="indexMsg" style="margin:0;align-self:center"></span>
          </div>
          <div class="cols">
            列数
            <input type="range" id="gcols" min="3" max="8" step="1">
            <b id="gcolsVal">6 列</b>
          </div>
        </div>
        <div class="grid" id="galleryGrid"></div>
      </div>
    </section>

  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const api = async (url, opt = {}) => {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opt });
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
};

// 导航（记住当前面板，刷新不跳回上传）
function showPanel(name) {
  document.querySelectorAll('nav button').forEach((x) => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach((x) => x.classList.remove('active'));
  const btn = document.querySelector(`nav button[data-panel="${name}"]`);
  if (btn) btn.classList.add('active');
  const el = document.getElementById(name);
  if (el) el.classList.add('active');
  try { localStorage.setItem('admin-panel', name); } catch (e) {}
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => showPanel(b.dataset.panel)));
showPanel((() => { try { return localStorage.getItem('admin-panel') || 'upload'; } catch (e) { return 'upload'; } })());

// 存储下拉
async function refreshStorages(selId) {
  const data = await api('/api/storages');
  const sel = document.getElementById(selId || 'storage');
  sel.innerHTML = data.storages.map((s) => `<option value="${s.id}" ${s.id === data.defaultStorageId ? 'selected' : ''}>${s.name}（${s.id}）</option>`).join('');
  renderStorageRows(data);
  return data;
}

// 上传
let picked = [];
const drop = $('#drop');
drop.addEventListener('click', () => $('#file').click());
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); setFiles(e.dataTransfer.files); });
$('#file').addEventListener('change', (e) => setFiles(e.target.files));
function setFiles(list) {
  picked = Array.from(list || []);
  drop.innerHTML = picked.length ? `<span class="drop-ico">✅</span><b>已选择 ${picked.length} 张</b><br><small>点击可重新选择</small>` : `<span class="drop-ico">🖼</span>拖拽图片到此处或<b>点击选择</b><br><small>支持 JPG / PNG / WEBP，自动压缩为 AVIF</small>`;
  $('#start').disabled = !picked.length;
}
$('#start').addEventListener('click', async () => {
  if (!picked.length) return;
  const interval = Math.max(0, parseInt($('#interval').value, 10) || 0);
  const storage = $('#storage').value, pool = $('#pool').value;
  const bar = $('#bar'), prog = $('#progress'), log = $('#log');
  prog.style.display = 'block'; log.style.display = 'block';
  log.innerHTML = ''; bar.style.width = '3%';
  const rows = [];
  picked.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML = `<span class="t-name">${i + 1}. ${f.name}</span><span class="t-state">等待</span>`;
    log.appendChild(row); rows.push(row);
  });
  let done = 0, failed = 0;
  let indexUrl = null, indexError = null;
  for (let i = 0; i < picked.length; i++) {
    const f = picked[i], row = rows[i];
    const st = row.querySelector('.t-state');
    st.textContent = '上传中…'; st.className = 't-state running';
    try {
      const fd = new FormData();
      fd.append('files', f);
      fd.append('storage', storage);
      fd.append('pool', pool);
      const res = await fetch('/api/upload', { method: 'POST', body: fd });
      const j = await res.json();
      const r = (j.results || [])[0] || {};
      if (j.indexUrl) indexUrl = j.indexUrl;
      if (j.indexError) indexError = j.indexError;
      if (j.ok && r.status !== 'error') {
        st.textContent = r.status === 'skipped' ? '跳过（已存在）' : '成功';
        st.className = 't-state ok';
      } else {
        failed += 1;
        st.textContent = '失败';
        st.className = 't-state err';
        st.title = r.error || j.error || '未知';
      }
    } catch (e) {
      failed += 1;
      st.textContent = '失败'; st.className = 't-state err'; st.title = e.message;
    }
    done += 1;
    bar.style.width = Math.round((done / picked.length) * 100) + '%';
    if (interval > 0 && i < picked.length - 1) await new Promise((r) => setTimeout(r, interval));
  }
  // 索引发布状态：上传后自动发布为桶内对象（CDN 缓存 60s），线上无需重新构建部署
  const pub = document.createElement('div');
  pub.className = 'task-row';
  if (indexUrl) {
    pub.innerHTML = `<span class="t-name">索引已发布（桶内对象，CDN 缓存 60s），线上约 1 分钟内生效</span><span class="t-state ok">已生效</span>`;
    log.appendChild(pub);
  } else if (indexError) {
    pub.innerHTML = `<span class="t-name">索引发布失败：${indexError}（图片已在桶里，点图库页「发布索引」补发）</span><span class="t-state err">未生效</span>`;
    log.appendChild(pub);
  }
  bar.style.width = '100%';
  if (!failed) { picked = []; $('#file').value = ''; setFiles(null); loadGallery(); }
  setTimeout(() => { prog.style.display = 'none'; }, 1500);
});

// 存储配置 CRUD
let editing = null;
function renderStorageRows(data) {
  $('#storageRows').innerHTML = data.storages.map((s) => `
    <tr>
      <td>${s.id}${s.id === data.defaultStorageId ? ' ★' : ''}</td>
      <td>${s.name}</td><td>${s.provider}</td><td>${s.bucket}</td><td style="word-break:break-all">${s.baseUrl}</td>
      <td><button class="btn ghost mini" onclick='editStorage(${JSON.stringify(JSON.stringify(s))})'>编辑</button>
      <button class="btn ghost mini" onclick="setCors('${s.id}')">CORS</button>
      <button class="btn ghost mini" onclick="rmStorage('${s.id}')">删除</button></td>
    </tr>`).join('');
}
function editStorage(json) {
  const s = JSON.parse(json);
  editing = s;
  $('#f_name').value = s.name; $('#f_provider').value = s.provider; $('#f_endpoint').value = s.endpoint;
  $('#f_region').value = s.region; $('#f_ak').value = s.accessKeyId; $('#f_sk').value = s.secretAccessKey;
  $('#f_bucket').value = s.bucket; $('#f_prefix').value = s.pathPrefix || ''; $('#f_base').value = s.baseUrl;
  showPanel('storages');
}
async function rmStorage(id) {
  if (!confirm('删除存储配置 ' + id + '？（不影响已上传对象）')) return;
  const data = await api('/api/storages');
  data.storages = data.storages.filter((s) => s.id !== id);
  if (data.defaultStorageId === id) data.defaultStorageId = data.storages[0]?.id || null;
  await fetch('/api/storages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  refreshStorages();
}
async function setCors(id) {
  if (!confirm('为 ' + id + ' 设置 CORS？\n规则：任意来源 → GET/HEAD（公开图片展示所需）')) return;
  try {
    const r = await api('/api/storages/' + id + '/cors', { method: 'POST', body: JSON.stringify({ origins: ['*'] }) });
    alert('CORS 已设置：' + r.origins.join(', ') + ' → GET/HEAD');
  } catch (e) { alert('CORS 设置失败：' + e.message); }
}
$('#testBtn').addEventListener('click', async () => {
  const msg = $('#storageMsg'); msg.className = 'msg'; msg.textContent = '测试中…';
  try {
    const r = await api('/api/storages/test', { method: 'POST', body: JSON.stringify(readForm()) });
    msg.textContent = '连接成功，桶内对象数：' + r.keyCount; msg.classList.add('ok');
  } catch (e) { msg.textContent = '连接失败：' + e.message; msg.classList.add('err'); }
});
$('#saveBtn').addEventListener('click', async () => {
  const data = await api('/api/storages');
  const s = readForm();
  if (editing) { const i = data.storages.findIndex((x) => x.id === editing.id); if (i >= 0) data.storages[i] = { ...data.storages[i], ...s }; }
  else { s.id = (s.provider === 'r2' ? 'r2-' : s.provider + '-') + (s.bucket || 'bucket') + (Date.now().toString(36).slice(-3)); data.storages.push(s); }
  if (!data.defaultStorageId) data.defaultStorageId = data.storages[0].id;
  await fetch('/api/storages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  editing = null; refreshStorages(); $('#storageMsg').textContent = '已保存'; $('#storageMsg').className = 'msg ok';
});
function readForm() {
  return {
    name: $('#f_name').value, provider: $('#f_provider').value, endpoint: $('#f_endpoint').value,
    region: $('#f_region').value, accessKeyId: $('#f_ak').value, secretAccessKey: $('#f_sk').value,
    bucket: $('#f_bucket').value, pathPrefix: $('#f_prefix').value, baseUrl: $('#f_base').value,
    acl: 'public-read', cacheControl: 'public, max-age=31536000, immutable', enabled: true,
  };
}

// 图库
let gcols = 6;
try { gcols = parseInt(localStorage.getItem('admin-gallery-cols') || '6', 10); } catch (e) {}
gcols = Math.min(8, Math.max(3, gcols));
const gSlider = $('#gcols');
gSlider.value = gcols; $('#gcolsVal').textContent = gcols + ' 列';
function applyGcols() {
  $('#galleryGrid').style.gridTemplateColumns = `repeat(${gcols}, 1fr)`;
}
gSlider.addEventListener('input', () => {
  gcols = parseInt(gSlider.value, 10);
  $('#gcolsVal').textContent = gcols + ' 列';
  try { localStorage.setItem('admin-gallery-cols', String(gcols)); } catch (e) {}
  applyGcols();
});
async function loadGallery() {
  try {
    const { images } = await api('/api/gallery');
    $('#count').textContent = `（${images.length} 张）`;
    if (!images.length) { $('#galleryGrid').innerHTML = '<div class="empty">暂无图片，先去「上传」导入吧</div>'; return; }
    $('#galleryGrid').innerHTML = images.map((i) => `
      <div class="item" title="点击预览大图" onclick="window.open('${i.url}','_blank')">
        <span class="tag pool ${i.pool}">${i.pool}</span>
        <img loading="lazy" src="${i.thumb}" onerror="this.style.display='none'">
        <div class="meta"><b>${i.id}</b><br>${i.width}×${i.height} · ${(i.size / 1024).toFixed(0)}KB</div>
        <button class="del" onclick="event.stopPropagation();delImage('${i.id}')">删除</button>
      </div>`).join('');
    applyGcols();
  } catch (e) { $('#galleryGrid').innerHTML = '<div class="msg">' + e.message + '</div>'; }
}
async function delImage(id) {
  if (!confirm('删除 ' + id + '？将同时删除存储对象与索引')) return;
  try {
    const r = await fetch('/api/gallery/' + id, { method: 'DELETE' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok && !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    if (j.indexWarning) alert(j.indexWarning);
    loadGallery();
  } catch (e) { alert(e.message); }
}
$('#genIndex').addEventListener('click', async () => {
  try {
    const r = await api('/api/index', { method: 'POST' });
    $('#indexMsg').textContent = `已发布（${r.count} 张）：${r.url}，线上约 1 分钟内生效`;
    $('#indexMsg').className = 'msg ok';
  } catch (e) { $('#indexMsg').textContent = e.message; $('#indexMsg').className = 'msg err'; }
});

refreshStorages().then(loadGallery);
</script>
