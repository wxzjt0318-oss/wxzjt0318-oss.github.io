name: Rewrite Bangumi Posts in Chinese

# 存量 bangumi-* 文章中文化重写（scripts/wiki/rewrite-bangumi-chinese.mjs）。
# 需要访问 Bangumi / 萌娘百科 / 维基百科，因此在 Actions 中运行，结果提交回触发分支。
# - 手动运行：Actions → 本工作流 → Run workflow（可填 only = 逗号分隔的条目 ID）
# - claude/** 分支上修改重写 / 发文脚本或本文件时自动运行一次
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these subject IDs (comma-separated, empty = all)"
        required: false
        default: ""
        type: string
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/wiki/**"
      - "scripts/generate-bangumi-daily-post.mjs"
      - "scripts/bangumi-daily-posts.mjs"
      - ".github/workflows/bangumi-chinese-rewrite.yml"

permissions:
  contents: write

concurrency:
  group: "bangumi-chinese-rewrite-${{ github.ref }}"
  cancel-in-progress: false

env:
  TZ: "Asia/Shanghai"

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rewrite bangumi posts
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            node scripts/wiki/rewrite-bangumi-chinese.mjs --only "${{ inputs.only }}"
          else
            node scripts/wiki/rewrite-bangumi-chinese.mjs
          fi

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/posts reports/bangumi-chinese-rewrite.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(posts): rewrite bangumi posts in Chinese"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
